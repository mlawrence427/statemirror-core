version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statemirror
      POSTGRES_PASSWORD: statemirror
      POSTGRES_DB: statemirror
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statemirror -d statemirror"]
      interval: 5s
      timeout: 5s
      retries: 5

  statemirror:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://statemirror:statemirror@postgres:5432/statemirror
      PORT: 8080
      MAX_PAYLOAD_BYTES: 1048576
      READ_API_KEYS: smr_test_read_key_123
      WRITE_API_KEYS: smw_test_write_key_456
      LOG_LEVEL: info
      CLEANUP_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
